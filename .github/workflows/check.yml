name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Luau 0.738
        run: |
          mkdir -p .tools/luau
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.738/luau-ubuntu.zip -o .tools/luau.zip
          unzip -q .tools/luau.zip -d .tools/luau
          chmod +x .tools/luau/luau .tools/luau/luau-compile
      - name: Verify generated files, compilation and behavior
        run: python tools/check.py
